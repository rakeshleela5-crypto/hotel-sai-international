name = "hotel-sai-international"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "hotel-sai-international-db"
database_id = "b7ede30b-60b5-4a2d-8de6-faf7001f303f"

# Public environment variables (safe to commit)
[vars]
HOTEL_NAME  = "Hotel Sai International, Rayagada"
HOTEL_PHONE = "+919390553301"
HOTEL_EMAIL = "reservations@hotelsaiinternational.com"

# ──────────────────────────────────────────────────────────
# SECRET bindings — NEVER put real values here.
# Run these ONE TIME in your terminal to save them encrypted:
#
#   npx wrangler secret put RAZORPAY_KEY_ID
#   npx wrangler secret put RAZORPAY_KEY_SECRET
#   npx wrangler secret put ADMIN_SECRET
#
# Find your Razorpay keys at:
#   https://dashboard.razorpay.com/ → Settings → API Keys
# ──────────────────────────────────────────────────────────
